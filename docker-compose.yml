name: eo-rag-prototype

services:
  backend:
    image: eo_rag_backend
    build: ./backend
    container_name: eo_rag_backend
    networks:
      - eo-rag-network
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    env_file:
      - ./.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  frontend:
    image: eo_rag_frontend
    build: ./frontend
    container_name: eo_rag_frontend
    env_file:
      - ./.env
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - eo-rag-network
    ports:
      - "${FRONTEND_HOST_PORT:-8501}:8501"
    restart: unless-stopped

networks:
  eo-rag-network:
    driver: bridge
